<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CommonStyles.css">
    <link rel="stylesheet" href="Gallary.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Document</title>
</head>
<body> 
   <div class="overlay">
    <button class="back"><i class="fa-solid fa-backward-step"></i></button>
    <div class="gallary-content">
            <div class="gallery-container">
                <button id="prevBtn"><i class="fa-solid fa-left-long"></i></button>
                <div class="gallery" id="gallery">
                <img src="images/image1.jpg" alt="Image 1" class="gallery-image"/>
                <img src="images/image2.jpg" alt="Image 2" class="gallery-image"/>
                <img src="images/image3.jpg" alt="Image 3" class="gallery-image"/>
                <img src="images/image4.jpg" alt="Image 4" class="gallery-image"/>
                <img src="images/image5.png" alt="Image 5" class="gallery-image"/>
                <img src="images/image6.png" alt="Image 6" class="gallery-image"/>
                <img src="images/image7.jpg" alt="Image 7" class="gallery-image"/>
                <img src="images/image8.jpg" alt="Image 8" class="gallery-image"/>
                <img src="images/image9.jpg" alt="Image 9" class="gallery-image"/>
                </div>
                <button id="nextBtn"><i class="fa-solid fa-right-long"></i></button>    
                <div id="lightbox" class="lightbox">
                    <span class="close"><i class="fa-solid fa-xmark"></i></span> 
                    <img class="lightbox-img" id="lightbox-img" />
                </div>
            </div>
    </div>
   </div>
    <script src="script.js"></script>
</body>
</html>
